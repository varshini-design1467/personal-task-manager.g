<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Personal Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<div class="container">

    <!-- Header -->
    <header class="header">
        <div>
            <h1>TaskFlow</h1>
            <p>Personal Task Manager</p>
        </div>

        <div class="date" id="todayDate"></div>
    </header>


    <!-- Statistics -->
    <div class="stats">

        <div class="stat-card">
            <span>Total Tasks</span>
            <strong id="totalTasks">0</strong>
        </div>

        <div class="stat-card">
            <span>Completed</span>
            <strong id="completedTasks">0</strong>
        </div>

        <div class="stat-card">
            <span>Pending</span>
            <strong id="pendingTasks">0</strong>
        </div>

    </div>


    <!-- Add Task -->
    <section class="add-section">

        <h2>Add New Task</h2>

        <div class="input-row">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                autocomplete="off"
            >

            <select id="priorityInput">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>

            <button id="addButton">Add Task</button>

        </div>

    </section>


    <!-- Task List -->
    <section class="task-section">

        <div class="section-header">

            <div>
                <h2>My Tasks</h2>
                <p>Manage your daily tasks</p>
            </div>

            <select id="filterTasks">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>

        </div>


        <div id="taskList">

            <!-- Tasks will appear here -->

            <div class="empty-message" id="emptyMessage">
                <div class="empty-icon">✓</div>
                <h3>No tasks yet</h3>
                <p>Add your first task above.</p>
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>TaskFlow &copy; 2026 | Personal Productivity Manager</p>
    </footer>

</div>


<script src="script.js"></script>
```

</body>
</html>
